name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Visit app and wake it if asleep
        env:
          APP_URL: https://ehospital-kpi-pack-ciun5bgxma6ufbq5revtnf.streamlit.app
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(process.env.APP_URL, { timeout: 90000, waitUntil: 'domcontentloaded' });
            const btn = page.getByRole('button', { name: /get this app back up/i });
            if (await btn.isVisible({ timeout: 15000 }).catch(() => false)) {
              await btn.click();
              console.log('App was asleep - wake-up clicked');
            } else {
              console.log('App already awake');
            }
            await page.waitForTimeout(45000);
            await browser.close();
          })();"
